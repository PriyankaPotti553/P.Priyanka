<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Job Recommender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #f0f4ff, #ffffff);
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #4a00e0;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 12px;
            border: 2px dashed #888;
            border-radius: 10px;
            width: 80%;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Your Resume</h1>
        <p>Let our AI find jobs that match your skills and goals!</p>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="resume" accept=".pdf" required>
            <br>
            <button type="submit">Get Job Recommendations</button>
        </form>
    </div>
</body>
</html>
