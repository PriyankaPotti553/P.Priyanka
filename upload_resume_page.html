<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Skill Extractor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI'; }
    .container { max-width: 600px; margin-top: 60px; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 0 12px rgba(0,0,0,0.1); }
    .badge-skill { background: #007bff; color: #fff; margin: 4px; padding: 6px 12px; border-radius: 20px; font-size: 14px; display: inline-block; }
    .job-role { background-color: #eaf6ff; color: #0d6efd; margin: 10px 0; padding: 12px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="container text-center">
    <h3 class="mb-4">Upload Your Resume</h3>
    <form id="uploadForm" enctype="multipart/form-data">
      <input class="form-control mb-3" type="file" name="resume" accept=".pdf,.docx,.txt" required>
      <button type="submit" class="btn btn-primary w-100">Extract Skills & Suggest Jobs</button>
    </form>

    <div id="result" class="mt-4" style="display: none;"></div>
    <div class="mt-3">
      <a href="/find_jobs" class="btn btn-outline-secondary btn-sm">Find Jobs</a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script>
    $('#uploadForm').on('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      $('#result').hide().html('');

      fetch('/upload_resume', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          $('#result').html('<div class="text-danger">' + data.error + '</div>').show();
        } else {
          let html = "<h5>Extracted Skills</h5>";
          data.skills.forEach(skill => html += `<span class="badge-skill">${skill}</span>`);
          html += "<h5 class='mt-3'>Suggested Job Roles</h5>";
          data.suggested_job_roles.forEach(role => html += `<div class="job-role">${role}</div>`);
          $('#result').html(html).show();
        }
      }).catch(err => {
        $('#result').html(`<div class="text-danger">${err.message}</div>`).show();
      });
    });
  </script>
</body>
</html>
